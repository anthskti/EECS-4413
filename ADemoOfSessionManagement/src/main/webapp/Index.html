<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>User login page</title>
</head>
<body>
        <fieldset>
		<legend id="lg"> Login information </legend>
		<form id="myform" action="login" method="POST">
			<table>
				<tr>
					<td><label for="un"> User Name: </label></td>
					<td><input name="userName" id="un" type="text" /></td>
				</tr>
				<tr>
					<td><label for="pw">Password: </label></td>
					<td><input name="userPassword" id="pw" type="password"/></td>
				</tr>
				<tr>
					<td><button type="submit" id="submit" name="submit"
							value="true">Submit</button></td>
				</tr>			
			</table>
		</form>
	</fieldset>
</body>
</html>
