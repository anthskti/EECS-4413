<!DOCTYPE html> 

<html> 

<head> 

    <title>Shopping Cart Price Calculator</title> 
	<link rel="stylesheet" type="text/css" href="styles.css">
	<script src="validations.js"></script> <!-- Link to external JavaScript file --> 
</head> 

<body> 

    <header> 

        <h1>Shopping Cart Calculator</h1> 

    </header> 

  

    <main> 

        <form action="CalculatorServlet"  method="post" id="cartForm"> 

            <fieldset> 

                <legend>Enter Shopping Cart Details</legend> 

                Number of Items: <input type="text" name="noItems" id="noItems"><br> 

                Price per Item: <input type="text" name="price" id="price"><br> 

                Tax Rate: <input type="text" name="tax" id="tax"><br> 

                <input type="submit" value="Calculate" id="Calculate"> 

            </fieldset> 

        </form> 

    </main> 


    <footer> 

        <p>Created for E-Commerce Lab</p> 

    </footer> 

</body> 

</html>
